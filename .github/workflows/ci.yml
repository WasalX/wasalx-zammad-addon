name: CI

on:
  pull_request:
  merge_group:
  push: {branches: [main]}

permissions: {contents: read}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STYLE_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '0' }}
          persist-credentials: false
      - name: Check workflow changes with actionlint
        shell: bash
        run: |
          if git diff --quiet "$STYLE_BASE" HEAD -- .github; then
            exit 0
          fi
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          archive="$scratch/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$scratch" actionlint
          mkdir "$scratch/base"
          git archive "$STYLE_BASE" .github | tar -x -C "$scratch/base"
          git init --quiet "$scratch/base"
          lint_workflows() (
            cd "$1" || exit
            status=0
            "$scratch/actionlint" -format '{{json .}}' > "$scratch/findings.json" || status=$?
            if ((status)); then
              [[ $status == 1 ]] || exit "$status"
              jq -ce 'select(type == "array" and length > 0)[] | [.filepath, .kind, .message]' "$scratch/findings.json"
            fi
          )
          lint_workflows "$scratch/base" | LC_ALL=C sort > "$scratch/base-findings"
          lint_workflows "$PWD" | LC_ALL=C sort > "$scratch/head-findings"
          LC_ALL=C comm -13 "$scratch/base-findings" "$scratch/head-findings" | tee "$scratch/new-findings"
          printf 'actionlint base=%s head=%s new=%s\n' \
            "$(wc -l < "$scratch/base-findings")" "$(wc -l < "$scratch/head-findings")" \
            "$(wc -l < "$scratch/new-findings")"
          test ! -s "$scratch/new-findings"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24.22.3', package-manager-cache: false}
      - name: Enable pinned pnpm
        run: |
          corepack enable
          store=$(pnpm store path --silent)
          echo "PNPM_STORE_PATH=$store" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pnpm-cache
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'patches/**') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install test prerequisites
        run: |
          pnpm install --frozen-lockfile
          if ! ruby -rminitest -e 'puts RUBY_VERSION'; then
            sudo apt-get update && sudo apt-get install -y ruby ruby-minitest
          fi
          # The package suite uses platform-owned contract inputs.
          platform=https://raw.githubusercontent.com/WasalX/wasalx-platform/5d87b78af86030d6f615f205a015664cbdc52a4d
          for input in infra/docker/full/zammad/{install-package,verify-package}.rb \
            tests/fixtures/native-session-state-contract.rb; do
            curl -fsS -o "$input" "$platform/$input"
          done
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Check changed source style
        run: |
          pipx run --spec pre-commit==4.6.2 pre-commit run \
            --from-ref "$STYLE_BASE" --to-ref HEAD --show-diff-on-failure
      - run: pnpm run zammad:package
      - name: Committed packages are unchanged
        run: git diff --exit-code -- build/zammad
      - run: pnpm run test:package
      - name: Run standalone Ruby contracts
        run: |
          ruby tests/portal-delegation-test.rb
          ruby tests/portal-mail-delivery-contract.rb
          ruby tests/zammad-redis-tls.test.rb
      - run: pnpm run test:components --maxWorkers=4 --no-file-parallelism
      - run: pnpm --filter @wasalx/zammad-frontend-test run typecheck

  ci-gate:
    if: always()
    needs: [checks, dependency-review]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require checks and applicable dependency review
        env:
          EVENT: ${{ github.event_name }}
          CHECKS: ${{ needs.checks.result }}
          REVIEW: ${{ needs.dependency-review.result }}
        run: |
          case "$EVENT:$CHECKS:$REVIEW" in
            pull_request:success:success|push:success:skipped|merge_group:success:skipped) exit 0 ;;
          esac
          echo "Unexpected CI results for $EVENT: checks=$CHECKS, dependency-review=$REVIEW" >&2
          exit 1
